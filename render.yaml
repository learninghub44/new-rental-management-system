services:
  - type: web
    name: rental-management-system
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: LOGIN_RATE_LIMIT
        value: 5/minute
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: PAYHERO_BASE_URL
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_WEBHOOK_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL_BASE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: no-reply@christeck.co.ke
      - key: SMTP_FROM_NAME
        value: Rental Management
      - key: SMTP_USE_TLS
        value: "true"
      - key: COMPANY_NAME
        value: Christech Rentals
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
