{% extends "shared/base.html" %}
{% block title %}More{% endblock %}
{% block content %}
<div class="pb-24 min-h-screen">
  <header class="bg-slate-900 text-white px-6 pt-8 pb-6">
    <h1 class="text-xl font-bold">More</h1>
  </header>

  <main class="px-4 -mt-2 space-y-3">
    <a href="/admin/invoices" class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/2563eb/invoice.png" alt="" />
        <span class="font-medium text-slate-800">Invoices</span>
      </div>
      <span class="text-slate-300">›</span>
    </a>
    <a href="/admin/maintenance" class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/2563eb/maintenance.png" alt="" />
        <span class="font-medium text-slate-800">Maintenance</span>
      </div>
      <span class="text-slate-300">›</span>
    </a>
    <a href="/admin/expenses" class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/2563eb/expensive.png" alt="" />
        <span class="font-medium text-slate-800">Expenses</span>
      </div>
      <span class="text-slate-300">›</span>
    </a>
    <a href="/admin/reports" class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/2563eb/combo-chart.png" alt="" />
        <span class="font-medium text-slate-800">Reports</span>
      </div>
      <span class="text-slate-300">›</span>
    </a>
    <a href="/admin/users" class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/2563eb/user-group-man-man.png" alt="" />
        <span class="font-medium text-slate-800">Users</span>
      </div>
      <span class="text-slate-300">›</span>
    </a>
    <div class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4 opacity-50">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/94a3b8/settings.png" alt="" />
        <span class="font-medium text-slate-500">Settings</span>
      </div>
      <span class="text-xs text-slate-400">Coming soon</span>
    </div>
    {% if user.role.value == 'admin' %}
    <a href="/admin/developer" class="flex items-center justify-between bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/ios/24/2563eb/source-code.png" alt="" />
        <span class="font-medium text-slate-800">Developer</span>
      </div>
      <span class="text-slate-300">›</span>
    </a>
    {% endif %}
  </main>

  {% include "admin/_bottom_nav.html" with context %}
</div>
{% endblock %}
