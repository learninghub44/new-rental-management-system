{% extends "shared/base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<div class="pb-24 min-h-screen">
  <header class="bg-slate-900 text-white px-6 pt-8 pb-6">
    <a href="/admin/payments" class="text-slate-400 text-xs">← Payments</a>
    <h1 class="text-xl font-bold mt-1">Record Payment</h1>
  </header>

  <main class="px-4 -mt-2">
    <form method="post" action="/admin/payments/record" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4 mt-4">
      {% if error %}<p class="text-sm text-red-600 bg-red-50 rounded-lg p-3">{{ error }}</p>{% endif %}

      <div>
        <label class="text-xs text-slate-500">Tenant</label>
        <select name="tenant_id" required onchange="window.location = '/admin/payments/record?tenant_id=' + this.value"
                class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
          <option value="">Select tenant</option>
          {% for t in tenants %}
          <option value="{{ t.id }}" {% if selected_tenant_id == t.id|string %}selected{% endif %}>{{ t.full_name }} — {{ t.phone }}</option>
          {% endfor %}
        </select>
      </div>

      {% if outstanding_invoices %}
      <div>
        <label class="text-xs text-slate-500">Apply to invoice (optional)</label>
        <select name="invoice_id" class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
          <option value="">General payment (oldest invoices first)</option>
          {% for invoice in outstanding_invoices %}
          <option value="{{ invoice.id }}">{{ invoice.invoice_number }} — bal. {{ "{:,.2f}".format(invoice.balance) }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-500">Amount</label>
          <input type="number" step="0.01" name="amount" required class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm" />
        </div>
        <div>
          <label class="text-xs text-slate-500">Method</label>
          <select name="method" class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
            <option value="cash">Cash</option>
            <option value="bank">Bank Transfer</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-xs text-slate-500">Payment date</label>
        <input type="date" name="payment_date" required class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-xs text-slate-500">Reference (optional)</label>
        <input type="text" name="reference" class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm" />
      </div>

      <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-3 rounded-xl">Record Payment</button>
    </form>
  </main>

  {% include "admin/_bottom_nav.html" with context %}
</div>
{% endblock %}
