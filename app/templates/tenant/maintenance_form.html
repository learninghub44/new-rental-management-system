{% extends "shared/base.html" %}
{% block title %}New Request{% endblock %}
{% block content %}
<div class="pb-24 min-h-screen">
  <header class="bg-slate-900 text-white px-6 pt-8 pb-6 rounded-b-3xl">
    <h1 class="text-xl font-bold">New Maintenance Request</h1>
  </header>

  <main class="px-4 -mt-2">
    <form method="post" action="/tenant/maintenance/new" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4 mt-4">
      {% if error %}<p class="text-sm text-red-600 bg-red-50 rounded-lg p-3">{{ error }}</p>{% endif %}

      <div>
        <label class="text-xs text-slate-500">Title</label>
        <input name="title" required maxlength="200" class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-xs text-slate-500">Description</label>
        <textarea name="description" required rows="4" class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></textarea>
      </div>
      <div>
        <label class="text-xs text-slate-500">Priority</label>
        <select name="priority" class="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
          {% for p in priorities %}
          <option value="{{ p.value }}" {% if p.value == 'medium' %}selected{% endif %}>{{ p.value|title }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-3 rounded-xl">Submit Request</button>
    </form>
  </main>

  {% include "tenant/_bottom_nav.html" with context %}
</div>
{% endblock %}
