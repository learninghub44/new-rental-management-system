{% set path = request.url.path %}
<nav class="tp fixed bottom-0 inset-x-0 bg-white border-t border-tp-border px-1 py-1.5 flex justify-around z-40"
     style="padding-bottom: max(0.375rem, env(safe-area-inset-bottom));">
  <a href="/tenant/home" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors {{ 'text-tp-primary' if path == '/tenant/home' else 'text-tp-muted' }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ '2.2' if path == '/tenant/home' else '1.8' }}" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
    </svg>
    <span class="text-[10.5px] font-medium">Home</span>
  </a>
  <a href="/tenant/rent" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors {{ 'text-tp-primary' if path == '/tenant/rent' else 'text-tp-muted' }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ '2.2' if path == '/tenant/rent' else '1.8' }}" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="3" width="16" height="18" rx="2" /><path d="M8 8h8M8 12h8M8 16h4" />
    </svg>
    <span class="text-[10.5px] font-medium">Rent</span>
  </a>
  <a href="/tenant/payments" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors {{ 'text-tp-primary' if path == '/tenant/payments' else 'text-tp-muted' }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ '2.2' if path == '/tenant/payments' else '1.8' }}" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="6" width="19" height="13" rx="2.5" /><path d="M2.5 10.5h19" /><path d="M6 15h4" />
    </svg>
    <span class="text-[10.5px] font-medium">Payments</span>
  </a>
  <a href="/tenant/maintenance" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors {{ 'text-tp-primary' if path.startswith('/tenant/maintenance') else 'text-tp-muted' }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ '2.2' if path.startswith('/tenant/maintenance') else '1.8' }}" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a3 3 0 0 0-4.2 4.2L4 17v3h3l6.5-6.5a3 3 0 0 0 4.2-4.2l-2.1 2.1-2-2 2.1-2.1Z" />
    </svg>
    <span class="text-[10.5px] font-medium">Maintenance</span>
  </a>
  <a href="/tenant/profile" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-colors {{ 'text-tp-primary' if path == '/tenant/profile' else 'text-tp-muted' }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ '2.2' if path == '/tenant/profile' else '1.8' }}" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.5" /><path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
    </svg>
    <span class="text-[10.5px] font-medium">Profile</span>
  </a>
</nav>
