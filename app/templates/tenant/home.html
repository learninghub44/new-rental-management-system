{% extends "shared/base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="pb-20 min-h-screen">
  <header class="bg-brand-600 text-white px-6 pt-8 pb-6 rounded-b-3xl">
    <p class="text-brand-100 text-sm">Welcome back</p>
    <h1 class="text-2xl font-bold">{{ user.name }}</h1>
  </header>

  <main class="px-6 -mt-4">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <p class="text-sm text-slate-500">Balance functionality wires up in Phase 11 (Billing &amp; Ledger).</p>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 px-2 py-2 flex justify-around">
    <a href="/tenant/home" class="flex flex-col items-center gap-1 px-3 py-1 text-brand-600">
      <img src="https://img.icons8.com/ios-filled/24/2563eb/home.png" alt="" />
      <span class="text-[11px] font-medium">Home</span>
    </a>
    <a href="/tenant/rent" class="flex flex-col items-center gap-1 px-3 py-1 text-slate-400">
      <img src="https://img.icons8.com/ios/24/94a3b8/receipt.png" alt="" />
      <span class="text-[11px] font-medium">Rent</span>
    </a>
    <a href="/tenant/payments" class="flex flex-col items-center gap-1 px-3 py-1 text-slate-400">
      <img src="https://img.icons8.com/ios/24/94a3b8/mobile-payment.png" alt="" />
      <span class="text-[11px] font-medium">Payments</span>
    </a>
    <a href="/tenant/maintenance" class="flex flex-col items-center gap-1 px-3 py-1 text-slate-400">
      <img src="https://img.icons8.com/ios/24/94a3b8/maintenance.png" alt="" />
      <span class="text-[11px] font-medium">Maintenance</span>
    </a>
    <a href="/tenant/profile" class="flex flex-col items-center gap-1 px-3 py-1 text-slate-400">
      <img src="https://img.icons8.com/ios/24/94a3b8/user.png" alt="" />
      <span class="text-[11px] font-medium">Profile</span>
    </a>
  </nav>
</div>
{% endblock %}
