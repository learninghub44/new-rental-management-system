{% extends "shared/base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col justify-center px-6 py-12">
  <div class="mx-auto w-full max-w-sm">
    <h1 class="text-2xl font-bold tracking-tight mb-8">Set a new password</h1>

    {% if error %}
    <div class="mb-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" action="/reset-password" class="space-y-4">
      <input type="hidden" name="token" value="{{ token }}" />
      <input type="hidden" name="uid" value="{{ uid }}" />
      <div>
        <label for="new_password" class="block text-sm font-medium text-slate-700 mb-1">New password</label>
        <input id="new_password" name="new_password" type="password" required minlength="8"
               class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-500" />
        <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
      </div>
      <button type="submit" class="w-full rounded-xl bg-brand-600 text-white font-semibold py-3.5">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
