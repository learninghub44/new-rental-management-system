{% extends "shared/base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col justify-center px-6 py-12">
  <div class="mx-auto w-full max-w-sm">
    <h1 class="text-2xl font-bold tracking-tight mb-1">Reset your password</h1>
    <p class="text-slate-500 text-sm mb-8">Enter your email and we'll send you a reset link.</p>

    {% if message %}
    <div class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm px-4 py-3">{{ message }}</div>
    {% endif %}

    <form method="post" action="/forgot-password" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" name="email" type="email" required
               class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>
      <button type="submit" class="w-full rounded-xl bg-brand-600 text-white font-semibold py-3.5">Send Reset Link</button>
      <a href="/login" class="block text-center text-sm text-slate-500 mt-4">Back to login</a>
    </form>
  </div>
</div>
{% endblock %}
