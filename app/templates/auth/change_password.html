{% extends "shared/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-6 py-10">
  <h1 class="text-xl font-bold mb-6">Change Password</h1>

  {% if error %}
  <div class="mb-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
  {% endif %}
  {% if message %}
  <div class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm px-4 py-3">{{ message }}</div>
  {% endif %}

  <form method="post" action="/settings/change-password" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Current password</label>
      <input name="current_password" type="password" required
             class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-500" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">New password</label>
      <input name="new_password" type="password" required minlength="8"
             class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-500" />
    </div>
    <button type="submit" class="w-full rounded-xl bg-brand-600 text-white font-semibold py-3.5">Update Password</button>
  </form>
</div>
{% endblock %}
